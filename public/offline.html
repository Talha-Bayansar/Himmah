<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12382f"><title>Himmah</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fdfcf9;color:#153f36;font:16px/1.6 system-ui}main{max-width:420px;padding:32px}img{border-radius:24px}h1{font-size:30px;line-height:1.2}button{margin-top:16px;background:#153f36;color:white;border:0;border-radius:12px;padding:14px 24px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #638344;outline-offset:3px}</style></head><body><main><img src="/pwa/icon-192.png" width="80" height="80" alt="Himmah"><h1 id="title">You’re offline.</h1><p id="description">Connect to the internet to sign in or open your organization. Your account information is never stored for offline access.</p><button id="retry">Try again</button></main><script>const messages={"en":{"title":"You’re offline.","description":"Connect to the internet to sign in or open your organization. Your account information is never stored for offline access.","retry":"Try again"},"nl":{"title":"Je bent offline.","description":"Maak verbinding met internet om in te loggen of je organisatie te openen. Je accountgegevens worden nooit opgeslagen voor offline toegang.","retry":"Opnieuw proberen"},"tr":{"title":"İnternet bağlantınız yok.","description":"Giriş yapmak veya kuruluşunuzu açmak için internete bağlanın. Hesap bilgileriniz çevrimdışı erişim için saklanmaz.","retry":"Tekrar dene"}};const language=document.cookie.match(/(?:^|;\s*)himmah_locale=(en|nl|tr)(?:;|$)/)?.[1]||"en";document.documentElement.lang=language;for(const id of ["title","description","retry"])document.getElementById(id).textContent=messages[language][id];document.getElementById("retry").onclick=()=>location.reload();</script></body></html>
